[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "modelroi-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "streamlit>=1.40,<2", "duckdb>=1.1,<2", "pandas>=2.2,<3", "pydantic>=2.9,<3", "pypdf>=5,<10", "python-docx>=1.1,<2", "python-pptx>=1,<2", "openpyxl>=3.1,<4", "xlrd>=2,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
