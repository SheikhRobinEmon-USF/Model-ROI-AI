name: Studio browser checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm run build && git diff --exit-code -- dist
        working-directory: frontend
      - run: python -m pip install -e '.[dev]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: |
          MODELROI_ENABLE_LOCAL=true python -m uvicorn app.api.main:app --port 8598 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8598/health && break; sleep 1; done
          python frontend/check_browser.py
